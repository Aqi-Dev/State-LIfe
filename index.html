<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State Life Premium Calculator</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f5f5;
            padding: 30px;
            font-family: Arial, sans-serif;
        }

        .card {
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .15);
        }

        .card-header {
            background: #002d62;
            color: #fff;
            border-radius: 12px 12px 0 0;
            text-align: center;
            padding: 15px;
        }

        .btn-calc {
            background: #002d62;
            color: #fff;
            font-weight: 600;
        }

        .btn-calc:hover {
            background: #001a40;
        }

        .result-box {
            background: #ffffff;
            border: 2px solid #002d62;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .result-box h2 {
            color: #002d62;
            font-weight: 700;
        }

        .label-title {
            font-weight: 600;
            color: #002d62;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <img src="https://waliahmed.com/wp-content/uploads/2024/02/new_statelife_logo.png" alt="State Life Logo"
                    style="max-height:80px;">
                <h3 class="mt-2">Premium Calculator</h3>
            </div>

            <div class="card-body p-4">
                <form id="calcForm">

                    <!-- NAME -->
                    <div class="mb-3">
                        <label class="label-title">Name</label>
                        <input type="text" id="name" class="form-control" required>
                    </div>

                    <!-- DOB & GENDER -->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="label-title">Date of Birth</label>
                            <input type="date" id="dob" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="label-title">Gender</label>
                            <select id="gender" class="form-select" required>
                                <option value="">Select Gender</option>
                                <option>Male</option>
                                <option>Female</option>
                            </select>
                        </div>
                    </div>

                    <!-- TERM -->
                    <div class="mb-3">
                        <label class="label-title">Term / Rate</label>
                        <select id="term" class="form-select" required>
                            <option value="">Select Term</option>
                            <option value="03_15">03 / 15</option>
                            <option value="03_20">03 / 20</option>
                            <option value="03_10">03 / 10</option>
                            <option value="81_20">81 / 20</option>
                            <option value="PLATINUM_91">Platinum 91 / 10</option>
                        </select>
                    </div>

                    <!-- PROFESSION -->
                    <div class="mb-3">
                        <label class="label-title">Profession</label>
                        <select id="profession" class="form-select" required>
                            <option value="">Select Profession</option>
                            <option value="1.25">Office Work</option>
                            <option value="1.25">Teacher</option>
                            <option value="1.25">Shop Keeper</option>
                            <option value="1.25">Auto Shop</option>
                            <option value="1.88">Landlord</option>
                            <option value="2.50">Army Person</option>
                            <option value="2.50">Police Person</option>
                            <option value="2.50">Security Guard</option>
                            <option value="2.50">Machine Operator</option>
                            <option value="4.50">Driver</option>
                            <option value="4.50">Labour</option>
                            <option value="4.50">Electrician</option>
                            <option value="4.50">Welder</option>
                            <option value="4.50">Line Man (Wapda)</option>
                            <option value="4.50">Line Man (PTCL)</option>
                        </select>
                    </div>

                    <!-- SUM ASSURED -->
                    <div class="mb-3">
                        <label class="label-title">Sum Assured</label>
                        <input type="number" id="sumAssured" class="form-control" min="0" required>
                    </div>

                    <button class="btn btn-calc w-100">Calculate Premium</button>

                </form>

                <div class="result-box" id="resultBox" style="display:none;">

                    <h2>Name: <span id="rName"></span></h2>

                    <h2>Premium: <span id="rPremium"></span></h2>

                    <p>
                        <strong>Sum Assured:</strong> <span id="rSum"></span> &nbsp;
                        <strong>Maturity:</strong> <span id="rMaturity"></span>
                    </p>

                    <p>
                        <span><strong>Age:</strong> <span id="rAge"></span></span> &nbsp;
                        <span><strong>Gender:</strong> <span id="rGender"></span></span>
                    </p>

                    <p>
                        <span><strong>Term:</strong> <span id="rTerm"></span></span> &nbsp;
                        <span><strong>Profession:</strong> <span id="rProf"></span></span>
                    </p>

                </div>
            </div>
        </div>
    </div>

    <script>

            "51": { "03_20": 59.35, "03_15": 73.32, "03_10": 105.57, "81_20": 118.68, "PLATINUM_91": 285.44 },
            "52": { "03_20": 60.66, "03_15": 74.41, "03_10": 106.44, "81_20": 120.07, "PLATINUM_91": 287.18 },
            "53": { "03_20": 62.09, "03_15": 75.59, "03_10": 107.39, "81_20": 121.59, "PLATINUM_91": 288.19 },
            "54": { "03_20": 63.62, "03_15": 76.86, "03_10": 108.43, "81_20": 123.19, "PLATINUM_91": 289.27 },
            "55": { "03_20": 65.27, "03_15": 78.23, "03_10": 109.54, "81_20": 124.90, "PLATINUM_91": 290.43 },
        };
        function formatPKR(val) {
            return "Rs " + val.toLocaleString('en-PK', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        document.getElementById('calcForm').addEventListener('submit', function (e) {
            e.preventDefault();

            let name = document.getElementById('name').value;
            let dob = new Date(document.getElementById('dob').value);
            let gender = document.getElementById('gender').value;
            let term = document.getElementById('term').value;
            let prof = document.getElementById('profession');
            let profRate = parseFloat(prof.value);
            let profText = prof.options[prof.selectedIndex].text;
            let sumAssured = parseFloat(document.getElementById('sumAssured').value);

            let today = new Date();
            let yrs = today.getFullYear() - dob.getFullYear();
            let mon = today.getMonth() - dob.getMonth();
            if (mon < 0) { yrs--; mon += 12; }
            if (mon >= 6) yrs++;

            if (gender === "Female") {
                yrs -= 2;
                if (yrs < 20) yrs = 20;
            }

            if (!rateData[yrs] || !rateData[yrs][term]) {
                alert("Rate not available for this age/term");
                return;
            }

            let baseRate = rateData[yrs][term];
            let adjRate = baseRate + profRate;
            if (sumAssured > 299999) adjRate -= 0.50;

            let maturity = sumAssured * 4;
            let prem = (adjRate * (sumAssured / 1000)) + 100;

            document.getElementById('rName').textContent = name;
            document.getElementById('rAge').textContent = yrs;
            document.getElementById('rGender').textContent = gender;
            document.getElementById('rTerm').textContent = term.replace('_', ' / ');
            document.getElementById('rProf').textContent = profText;
            document.getElementById('rSum').textContent = formatPKR(sumAssured);
            document.getElementById('rMaturity').textContent = formatPKR(maturity);
            document.getElementById('rPremium').textContent = formatPKR(prem);

            document.getElementById('resultBox').style.display = "block";
        });
    </script>

</body>

</html>
